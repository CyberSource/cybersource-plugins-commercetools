<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commercetools Cybersource Extension</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style id="antiClickjack">
    body {
      display: none;
    }
  </style>
  <script>
    // Framebusting with whitelist validation for legacy browsers - Checkmarx compliance
    (function() {
      // Hardcoded whitelist of allowed paths
      var whiteListEndpoints = [
        '/orders',
        '/orderData',
        '/capture',
        '/refund',
        '/authReversal',
        '/paymentDetails',
        '/paymentData',
        '/sync',
        '/decisionSync',
        '/configureExtension',
        '/generateHeader',
        '/favicon.ico'
      ];
      
      if (self === top) {
        // Not in a frame - show content
        var antiClickjack = document.getElementById("antiClickjack");
        if (antiClickjack && antiClickjack.parentNode) {
          antiClickjack.parentNode.removeChild(antiClickjack);
        }
      } else {
        // In a frame - validate before redirecting
        var currentPath = window.location.pathname;
        var matchedPath = null;
        
        for (var i = 0; i < whiteListEndpoints.length; i++) {
          if (currentPath === whiteListEndpoints[i] || currentPath.indexOf(whiteListEndpoints[i]) === 0) {
            matchedPath = whiteListEndpoints[i];  // Store the hardcoded value that matched
            break;
          }
        }
        
        if (matchedPath) {
          // Safe redirect using hardcoded whitelist value only (no DOM data)
          top.location = matchedPath;
        } else {
          console.error('Invalid redirect URL blocked for security');
        }
      }
    })();
  </script>
</head>
<body>
  <h1 class="order">Commercetools Cybersource Extension</h1>
  <div id="orderErrorMessage">
    <em></em>
  </div>
  <div id="orderSuccessMessage">
    <em></em>
  </div>
  <div class="leftDiv"><h1>Payments</h1></div>
  <div class="buttonright"><a class="button" href="/configureExtension" role="button" id="runScript">Run Script</a></div>
  <div class="buttonright"><a class="button" href="/decisionSync" role="button" id="decisionSync">Run Decision Sync</a></div>
  <div class="buttonright"><a class="button" href="/sync" role="button" id="sync">Run Sync</a></div>
  <table class="order" id="paymentDetailsTable" aria-describedby="This table refers to payment table">
    <thead>
      <tr>
        <th id="paymentIdHeading">Payment Id</th>
        <th id="orderTotalHeading">Order Total</th>
        <th id="paymentMethodHeading">Payment Method</th>
        <th id="dateCreatedHeading">Date Created</th>
        <th id="dateModifiedHeading">Date Modified</th>
      </tr>
    </thead>
    <tbody id="paymentDetailsBody"></tbody>
  </table>
  <div id="loading"><span>Loading...</span></div>
  <script type="module" src="javascript/orders.js"></script>
</body>
</html>
